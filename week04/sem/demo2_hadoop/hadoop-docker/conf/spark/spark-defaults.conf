# Пути и поведение по аналогии с Data Proc
spark.master                               yarn
spark.submit.deployMode                    client

spark.driver.memory                        1g
spark.executor.memory                      1g
spark.executor.cores                       1

spark.dynamicAllocation.enabled            true
spark.dynamicAllocation.minExecutors       0
spark.dynamicAllocation.maxExecutors       4
spark.shuffle.service.enabled              true

spark.eventLog.enabled                     true
spark.eventLog.dir                         hdfs:///var/log/spark/apps
spark.history.fs.logDirectory              hdfs:///var/log/spark/apps
spark.history.fs.cleaner.enabled           true
spark.yarn.historyServer.address           spark-history:18080

# jar-ы Spark лежат в HDFS, чтобы не загружать их при каждом запуске
spark.yarn.archive                         hdfs:///apps/spark/spark-jars.zip

spark.sql.warehouse.dir                    hdfs:///user/hive/warehouse

spark.yarn.appMasterEnv.PYSPARK_PYTHON     python3
spark.executorEnv.PYSPARK_PYTHON           python3
