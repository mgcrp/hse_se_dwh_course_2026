name: dataproc-local

# Один образ на все роли, роль задаётся через command.
# build описан только у namenode — иначе compose собирает один и тот же образ по разу на каждый сервис.
x-hadoop: &hadoop
  image: dataproc-local:2.1
  environment:
    HADOOP_HEAPSIZE_MAX: 1g
  restart: unless-stopped

services:
  # ---------- "мастер" ----------
  namenode:
    <<: *hadoop
    hostname: namenode
    build:
      context: .
    command: ["namenode"]
    ports:
      - "9870:9870"   # HDFS NameNode UI
      - "8020:8020"   # HDFS RPC
    volumes:
      - namenode:/data/hdfs/namenode
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9870/"]
      interval: 10s
      retries: 30

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports:
      - "8088:8088"   # YARN UI
    volumes:
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/ws/v1/cluster/info"]
      interval: 10s
      retries: 30

  historyserver:
    <<: *hadoop
    hostname: historyserver
    command: ["historyserver"]
    ports:
      - "19888:19888" # MapReduce JobHistory UI (+ агрегированные логи YARN)
    depends_on:
      - namenode

  # ---------- "подкластер с хранением": DataNode + NodeManager ----------
  worker1:
    <<: *hadoop
    hostname: worker1
    command: ["datanode", "nodemanager"]
    ports:
      - "8042:8042"   # NodeManager UI
    volumes:
      - datanode1:/hadoop/dfs/data
      - ./workspace:/workspace
    depends_on:
      - namenode
      - resourcemanager

  worker2:
    <<: *hadoop
    hostname: worker2
    command: ["datanode", "nodemanager"]
    ports:
      - "8043:8042"
    volumes:
      - datanode2:/hadoop/dfs/data
      - ./workspace:/workspace
    depends_on:
      - namenode
      - resourcemanager

  worker3:
    <<: *hadoop
    hostname: worker3
    command: ["datanode", "nodemanager"]
    ports:
      - "8044:8042"
    volumes:
      - datanode3:/hadoop/dfs/data
      - ./workspace:/workspace
    depends_on:
      - namenode
      - resourcemanager

  # ---------- одноразовая инициализация HDFS ----------
  hdfs-init:
    <<: *hadoop
    hostname: hdfs-init
    command: ["init"]
    restart: "no"
    depends_on:
      namenode:
        condition: service_healthy
      worker1:
        condition: service_started

  # ---------- Spark / Livy ----------
  spark-history:
    <<: *hadoop
    hostname: spark-history
    command: ["spark-history"]
    ports:
      - "18080:18080" # Spark History Server
    depends_on:
      hdfs-init:
        condition: service_completed_successfully

  livy:
    <<: *hadoop
    hostname: livy
    command: ["livy"]
    ports:
      - "8998:8998"   # Livy REST
    volumes:
      - ./workspace:/workspace
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8998/sessions"]
      interval: 10s
      retries: 30

volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3: